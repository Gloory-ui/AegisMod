plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
}

loom {
	mods {
		"aegis" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${project.geckolib_version}"
	include "software.bernie.geckolib:geckolib-fabric-1.21.1:${project.geckolib_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Auto-copy the built mod jar into the "Hero" game instance's mods folder after every build.
def heroModsDir = file("${System.getProperty('user.home')}/AppData/Roaming/.minecraft/versions/Hero/mods")

tasks.register('copyToHeroMods') {
	dependsOn tasks.named('remapJar')
	doLast {
		def jar = tasks.named('remapJar').get().archiveFile.get().asFile
		try {
			delete fileTree(dir: heroModsDir, includes: ['aegis-*.jar'])
			copy {
				from jar
				into heroModsDir
			}
			println "Aegis: copied ${jar.name} -> ${heroModsDir}"
		} catch (Exception e) {
			println "Aegis: could not update mods folder (is Minecraft running? close it to update the mod). ${e.message}"
		}
	}
}

tasks.named('build') {
	finalizedBy 'copyToHeroMods'
}
